<svg width="100%" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">

  <!-- chest body -->
  <rect x="6" y="30" width="52" height="38" rx="4" fill="#E8A020"/>
  <rect x="6" y="30" width="52" height="38" rx="4" fill="none" stroke="#8B5E00" stroke-width="2"/>
  <!-- chest lid -->
  <rect x="4" y="14" width="56" height="22" rx="6" fill="#F0B830"/>
  <rect x="4" y="14" width="56" height="22" rx="6" fill="none" stroke="#8B5E00" stroke-width="2"/>
  <!-- lock -->
  <rect x="25" y="19" width="14" height="14" rx="3" fill="#C0392B"/>
  <rect x="25" y="19" width="14" height="14" rx="3" fill="none" stroke="#8B5E00" stroke-width="1.5"/>
  <!-- stripe -->
  <line x1="6" y1="44" x2="58" y2="44" stroke="#8B5E00" stroke-width="2"/>
  <!-- coins -->
  <ellipse cx="18" cy="72" rx="7" ry="4" fill="#FFD93D" stroke="#C8A800" stroke-width="1"/>
  <ellipse cx="32" cy="75" rx="7" ry="4" fill="#FFD93D" stroke="#C8A800" stroke-width="1"/>
  <ellipse cx="46" cy="72" rx="7" ry="4" fill="#FFD93D" stroke="#C8A800" stroke-width="1"/>
  <!-- sparkles -->
  <circle cx="2" cy="18" r="3" fill="#FF6B6B"/>
  <circle cx="62" cy="12" r="3" fill="#6BCB77"/>
  <circle cx="64" cy="36" r="4" fill="#4D96FF"/>
  <!-- star -->
  <polygon points="54,8 56,14 62,14 57,18 59,24 54,20 49,24 51,18 46,14 52,14" fill="#FFD93D"/>

  <!-- LOOT -->
  <text x="74" y="52"
        font-family="Arial Black, sans-serif" font-weight="900"
        font-size="36" fill="#FF6B6B">LOOT</text>
  <!-- SHOP -->
  <text x="76" y="68"
        font-family="Arial, sans-serif" font-weight="700"
        font-size="11" fill="#4D96FF" letter-spacing="4">S H O P</text>

</svg>

